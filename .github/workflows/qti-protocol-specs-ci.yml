name: QTI Protocol Specs CI

on:
  pull_request:
    branches: [ main, staging, develop ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install markdownlint
        run: |
          npm install -g markdownlint-cli

      - name: Lint markdown specs
        run: |
          markdownlint "**/*.md" --ignore node_modules

      - name: Check file naming and locations
        run: |
          echo "Ensuring QTI_Protocol_v*_Specification.md files exist in repo"
          ls QTI_Protocol_v*_Specification.md

  spec-structure-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate institutional spec structure
        run: |
          status=0
          for file in QTI_Protocol_v*_Specification.md; do
            if grep -q "placeholder summary" "$file"; then
              echo "::warning file=$file::placeholder only - restore the full specification body"
              continue
            fi
            echo "Checking structure for $file"
            for section in "Objectives" "Architecture Overview" "Testing Matrix" "Validation Gates" "Risk Register"; do
              if ! grep -Eq "^## [0-9]+\. $section" "$file"; then
                echo "::error file=$file::missing numbered section '$section'"
                status=1
              fi
            done
          done
          exit $status
